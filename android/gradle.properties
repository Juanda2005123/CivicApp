org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Release builds ship without R8. shared_preferences_android calls Java and Kotlin
# classes from Dart through JNI, which R8 cannot see: it renamed and removed them
# and the release app froze on the launch screen. `shrink` is the property the
# Flutter Gradle plugin reads before turning minification on.
shrink=false
